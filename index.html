
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Admission Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            margin: 0;
            padding: 30px;
        }
        .container {
            width:65%;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 20px gray;
        }

        h1 {
            text-align: center;
            color: rgb(32, 109, 168);
        }

        .description {
            text-align: center;
            color: black;
            margin-bottom: 25px;
        }

       
        fieldset {
            border: 2px solid rgb(71, 165, 241);
            border-radius: 6px;
            margin-bottom: 20px;
            padding: 20px;
        }

        legend {
            color:rgb(24, 83, 186);
            font-weight: bold;
            padding: 5px;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        input[type="password"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid white;
            border-radius: 5px;
            box-sizing: border-box;
        }

        input[type="file"] {
            margin-top: 8px;
            margin-bottom: 10px;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .options label {
            display: inline;
            margin: 0;
            font-weight: normal;
        }

        .options input {
            margin: 0;
        }

        .declaration {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 20px;
        }

        .declaration label {
            margin: 0;
            font-weight: normal;
        }

        .buttons {
            text-align: center;
            margin-top: 25px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            color: white;
            background-color: rgb(35, 173, 181);
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background-color: rgb(12, 103, 173);
        }

        button[type="reset"] {
            background-color: gray;
        }

         button:hover[type="reset"] {
            background-color: rgb(3, 69, 69);
         }

        @media (max-width: 768px) {
            .container {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>College Admission Form</h1>

        <p class="description">
            Please fill in the details below to apply for admission.
        </p>

        <form>

            <fieldset>

                <legend>Personal Information</legend>

                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname"
                       placeholder="Enter your full name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone"
                       placeholder="Enter your phone number"
                       minlength="10" required>

                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password"
                       minlength="6"
                       placeholder="Minimum 6 characters" required>

                <label>Gender:</label>

                <div class="options">

                    <input type="radio" id="male"
                           name="gender" value="Male" required>
                    <label for="male">Male</label>

                    <input type="radio" id="female"
                           name="gender" value="Female">
                    <label for="female">Female</label>

                    <input type="radio" id="other"
                           name="gender" value="Other">
                    <label for="other">Other</label>

                </div>

                <label for="address">Address:</label>

                <textarea id="address" name="address"
                          rows="4"
                          placeholder="Enter your address"
                          required></textarea>

            </fieldset>

            <fieldset>

                <legend>Academic Details</legend>

                <label for="course">Select Course:</label>

                <select id="course" name="course" required>

                    <option value="">Select Course </option>
                    <option value="B.Tech CSE">B.Tech CSE</option>
                    <option value="B.Tech AI/ML">B.Tech AI/ML</option>
                    <option value="BBA">BBA</option>
                    <option value="BCA">BCA</option>

                </select>

            </fieldset>


            <fieldset>

                <legend>Course Preferences</legend>

                <label>Select Your Interests:</label>

                <div class="options">

                    <input type="checkbox" id="coding"
                           name="interests" value="Coding">
                    <label for="coding">Coding</label>

                    <input type="checkbox" id="sports"
                           name="interests" value="Sports">
                    <label for="sports">Sports</label>

                    <input type="checkbox" id="music"
                           name="interests" value="Music">
                    <label for="music">Music</label>

                    <input type="checkbox" id="reading"
                           name="interests" value="Reading">
                    <label for="reading">Reading</label>

                </div>

            </fieldset>

            <fieldset>

                <legend>Documents</legend>

                <label for="photo">Upload Photograph:</label>
                <input type="file" id="photo" name="photo"
                       accept="image/*" required>

                <label for="documents">Supporting Documents:</label>
                <input type="file" id="documents" name="documents"
                       accept=".pdf,.jpg,.jpeg,.png" required>

            </fieldset>

            <div class="declaration">

                <input type="checkbox" id="declaration"
                       name="declaration" required>

                <label for="declaration">
                    I declare that all the information provided
                    above is correct.
                </label>

            </div>

            <div class="buttons">

                <button type="submit">Submit</button>

                <button type="reset">Reset</button>

            </div>

        </form>

    </div>

</body>
</html>
